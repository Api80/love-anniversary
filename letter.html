<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#24382d">
  <title>写给未来的我们 · Our Story</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="letter-page">
  <a class="letter-back" href="index.html">← 回到我们的故事</a>
  <main class="letter-wrap">
    <div class="letter-photo reveal">
      <img src="assets/images/04-selfie.png" alt="雨天撑伞的留影">
      <span>For you, for us.</span>
    </div>
    <article class="letter-paper reveal">
      <p class="eyebrow">A LETTER TO OUR FUTURE</p>
      <h1>给未来的我们</h1>
      <div class="letter-body">
        <p>很高兴认识你，也很幸运未来是你。</p>
        <p>愿我们一直有话说、有饭吃、有期待，认真过好每一个普通日子。</p>
        <p>未来很长，请继续多多指教。</p>
      </div>
      <div class="letter-sign">
        <span>永远爱你的人</span>
        <strong>未完待续</strong>
      </div>
    </article>
  </main>
  <button class="music-toggle" id="music-toggle" type="button" aria-label="播放背景音乐" aria-pressed="false">
    <span class="music-disc" aria-hidden="true"><i></i></span>
    <span class="music-label">播放音乐</span>
  </button>
  <script src="js/main.js"></script>
</body>
</html>
