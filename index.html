<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Story ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="hearts"></div>
<section class="hero">
  <div class="hero-content">
    <p class="date">2026.05.01</p>
    <h1>Our Story</h1>
    <h2>我们的小小世界 ❤️</h2>
    <div class="counter" id="counter"></div>
    <p class="subtitle">从遇见你的那一天开始，每一天都值得被记录。</p>
    <a class="scroll" href="#story">↓ 打开我们的故事</a>
  </div>
</section>
<section id="story" class="story">
 <div class="intro card">
   <h2>🌸 故事开始</h2>
   <p>2026年5月1日<br>两个平行的世界，开始有了交集。</p>
 </div>
 <div class="timeline">
  <article class="memory">
   <img src="assets/images/photo1.webp">
   <div><h2>遇见你的夏天</h2><p>阳光刚好，微风刚好，你刚好出现在我的世界里。</p></div>
  </article>
  <article class="memory reverse">
   <img src="assets/images/photo2.webp">
   <div><h2>你的每一个笑容</h2><p>希望以后还能收藏更多这样的瞬间。</p></div>
  </article>
  <article class="memory">
   <img src="assets/images/photo3.webp">
   <div><h2>雨天也温柔</h2><p>希望以后，也能一直为你撑伞。</p></div>
  </article>
  <article class="memory reverse">
   <img src="assets/images/photo4.webp">
   <div><h2>我们的第一次合照</h2><p>记录两个笨蛋开心的样子。</p></div>
  </article>
 </div>
 <div class="future card">
  <h2>✨ To be continued...</h2>
  <p>一起旅行<br>一起看很多风景<br>一起吃很多好吃的<br>一起慢慢变老</p>
 </div>
</section>
<button id="music">🎵</button>
<script src="js/main.js"></script>
</body>
</html>
